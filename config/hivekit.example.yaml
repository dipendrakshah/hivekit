# Copy to deploy/.env / compose env. Keys do not live here —
# set them once in Settings → Models/Connectors (stored encrypted in SQLite).

server:
  port: 8787
  public_url: https://hive.example.com   # Caddy or Cloudflare terminates TLS in front

auth:
  token_env: HIVEKIT_TOKEN               # bootstrap owner token; passkey set on first login
  vault_key_env: HIVEKIT_MASTER_KEY      # AES key for the server-side secrets vault

# Master plans, workers execute. Both are hot-swappable at runtime.
models:
  master:
    provider: openrouter
    model: anthropic/claude-sonnet-4.6
    fallback: openai/gpt-4.1-mini
    temperature: 0.2
    max_tokens: 8192
  worker:
    provider: openrouter
    model: stealth/ox-alpha              # free/stealth worker
    fallback: meta-llama/llama-4-maverick
    temperature: 0.3
    max_tokens: 8192
  reviewer:                              # optional, deferred to v1.1 by default
    enabled: false

# Each thread is a directory: INSTRUCTIONS.md (you write) + MEMORY.md (the master writes).
# The files are the source of truth; SQLite stores the path and a content hash.
threads_dir: /data/threads

memory:
  # Prompt budget. Memory SIZE is decoupled from prompt size — only retrieved
  # entries are loaded, so a thread with 400 entries costs the same as one with 12.
  pinned_max_bytes: 1024     # operator corrections, always loaded in full
  rules_top_k: 8             # scope-matched, ranked by confirmations + recent use
  facts_top_n: 4             # scope-matched, unexpired

  # Promotion. One observation is a candidate and does nothing; it becomes a Rule
  # only after this many independent confirmations in DISTINCT jobs.
  # Operator corrections skip this and go straight to Pinned.
  promote_after: 3

  # Decay. Rules retire when unused; Facts expire on their own TTL.
  retire_unused_after_runs: 30
  default_fact_ttl_days: 90

  # Hold-out audit: every N runs, do one job with retrieval OFF and compare
  # approval rate, operator edits, retries and cost. Catches memory that is not
  # earning its tokens — the failure no other control detects.
  audit_every: 20

  git: false                 # commit each write; enables `hivekit memory log|diff|revert`
  diff_in_thread: true       # post the memory diff into the thread. Leave this on.

limits:
  max_workers_per_job: 8
  max_spawn_depth: 1                     # not configurable above 1
  tool_calls_per_worker: 8               # plus a loop guard on repeated identical calls
  job_timeout_minutes: 45
  budget_usd_per_job: 2.00
  budget_usd_per_day: 5.00               # across all threads; stops starting new jobs

policy:
  mode: ask                              # ask | auto | strict
  # Enforced in every mode. `auto` cannot override these, and neither can a routine.
  always_ask:
    - site.push
    - x.post
    - email.send
    - exec.run
  exec_allowlist:
    - "git status"
    - "git diff"
  # Sensitive scopes refuse stealth providers unless allowed here:
  stealth_allowed_scopes: []             # e.g. [x] but never [email] by default
  # A task holding untrusted (web/email) content loses these tools entirely.
  untrusted_revokes:
    - site.push
    - x.post
    - email.send
    - exec.run

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
  anthropic:
    base_url: https://api.anthropic.com
  ollama:
    base_url: http://127.0.0.1:11434/v1

# Connector credentials (X keys, IMAP app password) go in via the UI → vault.
connectors:
  site:
    repo: git@github.com:you/mysite.git
    branch: main
    method: git                          # draft-only works with read access too
  x:
    handle: "@you"
  email:
    imap_host: imap.gmail.com
    smtp_host: smtp.gmail.com            # sends always require approval
    folders: [INBOX]

# Routines are normally created from chat ("every morning at 07:00 …")
# and stored in SQLite. Seed a few declaratively if you prefer:
routines_seed:
  - name: morning-site-update
    cron: "0 7 * * * Asia/Kolkata"
    prompt: "Run the morning site sweep: scan sources, draft update, prep push for approval."
    notify: on-approval-only
