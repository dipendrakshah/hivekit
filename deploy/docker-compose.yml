# Hivekit — Caddy (auto-TLS) + gateway + one volume.
#
#   HIVEKIT_TOKEN=$(openssl rand -hex 24) \
#   HIVEKIT_MASTER_KEY=$(openssl rand -base64 32) \
#   docker compose -f deploy/docker-compose.yml up -d
#
# Run exactly ONE instance. Two schedulers fire every routine twice.

services:
  hivekit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hivekit:local
    restart: unless-stopped
    environment:
      HIVEKIT_TOKEN: ${HIVEKIT_TOKEN:?bootstrap owner token — see deploy/README.md}
      HIVEKIT_MASTER_KEY: ${HIVEKIT_MASTER_KEY:?vault key — see deploy/README.md}
      HIVEKIT_CONFIG: /config/hivekit.yaml
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      NODE_ENV: production
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - hivekit_data:/data
      - ../config:/config:ro
    expose:
      - "8787"
    # Only publish directly if nothing is terminating TLS in front.
    # ports: ["127.0.0.1:8787:8787"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 900M    # fits a t4g.nano; workers are I/O-bound, not local inference

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      HIVE_HOST: ${HIVE_HOST:?your hostname, e.g. hive.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [hivekit]

  # --- Alternative to Caddy: Cloudflare Tunnel. Nothing inbound on the host. ---
  # Drop the caddy service above and set PUBLIC_URL to your tunnel hostname.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on: [hivekit]

  # --- Optional: local models for the worker seat, zero marginal cost ---
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   volumes: [ollama:/root/.ollama]

volumes:
  hivekit_data:
  caddy_data:
  caddy_config:
  # ollama:
